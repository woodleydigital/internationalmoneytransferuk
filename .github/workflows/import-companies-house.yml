# Weekly public-record import. Reads each provider's own regulatory statement
# (data/disclosures/), then Companies House (data/companies-house/), and commits
# any change to the production branch, which triggers a Vercel deploy. The git
# history of data/ is the public-record audit trail.
name: Import public records

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
  push:
    branches: ["claude/imt-uk-website-mtiy91"]
    paths:
      - "lib/providers.ts"
      - "lib/provider-sources.ts"

permissions:
  contents: write

concurrency:
  group: import-companies-house
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Chromium for JavaScript-rendered provider pages
        run: npx playwright install --with-deps chromium
      - name: Install selectable PDF text reader
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Read provider service details
        env:
          IMT_SOURCE_CACHE_DIR: ${{ runner.temp }}/imt-provider-sources
        run: npm run import:services
      - name: Read provider regulatory statements
        env:
          IMT_SOURCE_CACHE_DIR: ${{ runner.temp }}/imt-provider-sources
        run: npm run import:disclosures
      - name: Read explicit brand notices
        run: npm run import:notices
      - name: Refresh provider logos
        run: npm run import:logos
      - name: Import Companies House
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: npm run import:companies-house
      - name: Import more of each company's record
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: npm run import:extras
      - name: Match Ombudsman complaints data
        # Runs after Companies House, which supplies the company names it matches on.
        run: npm run import:fos
      - name: Record this week's changes
        run: npm run record:changes
      - name: Commit changes
        run: |
          git config user.name "imt-uk-data-bot"
          git config user.email "imt-uk-data-bot@users.noreply.github.com"
          git add data/disclosures data/companies-house data/company-extras data/changes data/services data/notices data/fos data/logos.json public/logos
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Public records import $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Notify IndexNow search engines
        # Give the deploy a few minutes to go live first; a failure here never fails the import.
        continue-on-error: true
        run: |
          sleep 300
          npm run indexnow
